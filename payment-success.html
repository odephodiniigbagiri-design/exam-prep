<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Confirming payment</title>
</head>
<body>
  <h1>Confirming your payment</h1>
  <p id="message">Please wait...</p>

  <script>
    const FUNCTION_URL =
      '/api/verify-payment';

    const params = new URLSearchParams(
      window.location.search
    );

    const reference = params.get('reference');
    const message = document.getElementById('message');

    verifyPayment();

    async function verifyPayment() {
      if (!reference) {
        message.textContent =
          'No payment reference was found.';
        return;
      }

      try {
        const response = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ reference })
        });

        const result = await response.json();

        if (!response.ok || !result.paid) {
          throw new Error(
            result.error || 'Payment could not be verified.'
          );
        }

        message.textContent =
          'Payment confirmed. Sign in to access the full site.';

        setTimeout(() => {
          window.location.href = '/';
        }, 2500);
      } catch (error) {
        console.error(error);
        message.textContent =
          'Payment is not confirmed yet. Wait briefly and try again.';
      }
    }
  </script>
</body>
</html>
