<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complete your profile</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #FBF9F4;
      --surface: #fff;
      --surface-alt: #F1EEE4;
      --ink: #1F2A24;
      --ink-soft: #55605A;
      --border: #E4DFD3;
      --pine: #2F4B3C;
      --pine-deep: #1F3329;
      --amber: #E0AE55;
      --brick: #B4432E;
      --ok: #2E7D4F;
    }

    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    h1 { font-size: 22px; color: var(--pine-deep); margin: 0 0 10px; }
    p { font-size: 14px; color: var(--ink-soft); line-height: 1.5; }
    .card {
      border: 1px solid var(--border);
      background: var(--surface-alt);
      border-radius: 10px;
      padding: 22px;
      margin-top: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 6px;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      border: none;
      background: var(--amber);
      color: #211705;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .msg { font-size: 13px; margin-top: 12px; min-height: 16px; }
    .msg.err { color: var(--brick); }
    .msg.ok { color: var(--ok); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1 id="heading">Confirming your payment</h1>
  <p id="message">Please wait...</p>

  <div id="signup-card" class="card hidden">
    <p style="margin-top:0">
      Payment confirmed for <strong id="signup-email"></strong>.
      Complete your profile and create your account.
    </p>

    <label for="full-name">Full name</label>
    <input id="full-name" type="text" placeholder="e.g. John Doe">

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Email address" readonly>

    <label for="department">Department / course</label>
    <input id="department" type="text" placeholder="e.g. Medicine and Surgery">

    <label for="phone">Phone number</label>
    <input id="phone" type="tel" placeholder="e.g. 080XXXXXXXX">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters">

    <label for="confirm-password">Confirm password</label>
    <input id="confirm-password" type="password" autocomplete="new-password">

    <button id="create-account-button">Create account & unlock</button>
    <p class="msg" id="signup-message"></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://ijapytnwikzovdhsgcnh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqYXB5dG53aWt6b3ZkaHNnY25oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NzU2ODAsImV4cCI6MjEwNTM1MTY4MH0.O51p37THBEDrYZym7nF2x4TWM974uM66o4H55qGL0RE';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const FUNCTION_URL = '/api/verify-payment';
    const params = new URLSearchParams(window.location.search);
    const reference = params.get('reference');

    const heading = document.getElementById('heading');
    const message = document.getElementById('message');
    const signupCard = document.getElementById('signup-card');
    const signupEmailLabel = document.getElementById('signup-email');
    const signupMessage = document.getElementById('signup-message');
    const emailInput = document.getElementById('email');

    let verifiedEmail = null;

    verifyPayment();

    async function verifyPayment() {
      if (!reference) {
        message.textContent = 'No payment reference was found.';
        return;
      }

      try {
        const response = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reference })
        });

        const result = await response.json();

        if (!response.ok || !result.paid) {
          throw new Error(result.error || 'Payment could not be verified.');
        }

        verifiedEmail = result.email;
        heading.textContent = 'Payment confirmed';
        message.textContent = 'Finish your profile below.';
        signupEmailLabel.textContent = verifiedEmail;
        emailInput.value = verifiedEmail;
        signupCard.classList.remove('hidden');
      } catch (error) {
        console.error(error);
        message.textContent =
          'Payment is not confirmed yet. Please wait a moment and refresh the page.';
      }
    }

    document
      .getElementById('create-account-button')
      .addEventListener('click', createAccount);

    async function createAccount() {
      const fullName = document.getElementById('full-name').value.trim();
      const email = emailInput.value.trim().toLowerCase();
      const department = document.getElementById('department').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const button = document.getElementById('create-account-button');

      signupMessage.className = 'msg';

      if (!fullName) {
        signupMessage.textContent = 'Please enter your full name.';
        signupMessage.className = 'msg err';
        return;
      }

      if (!email || !email.includes('@')) {
        signupMessage.textContent = 'Please enter a valid email address.';
        signupMessage.className = 'msg err';
        return;
      }

      if (!department) {
        signupMessage.textContent = 'Please enter your department or course.';
        signupMessage.className = 'msg err';
        return;
      }

      if (!password || password.length < 6) {
        signupMessage.textContent = 'Password must be at least 6 characters.';
        signupMessage.className = 'msg err';
        return;
      }

      if (password !== confirmPassword) {
        signupMessage.textContent = 'Passwords do not match.';
        signupMessage.className = 'msg err';
        return;
      }

      button.disabled = true;
      signupMessage.textContent = 'Creating your account...';

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
              phone,
              department
            },
            emailRedirectTo: window.location.origin
          }
        });

        if (error) {
          if (/already registered/i.test(error.message)) {
            signupMessage.innerHTML =
              'This email already has an account. ' +
              '<a href="/">Go to the homepage</a> and log in with your password.';
            signupMessage.className = 'msg err';
          } else {
            throw error;
          }
          return;
        }

        if (data.session) {
          try {
            await fetch('/api/save-profile', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${data.session.access_token}`
              },
              body: JSON.stringify({
                full_name: fullName,
                email,
                phone,
                department
              })
            });
          } catch (profileError) {
            console.error('Profile save failed:', profileError);
          }

          signupMessage.textContent = 'Account created. Redirecting...';
          signupMessage.className = 'msg ok';
          setTimeout(() => { window.location.href = '/'; }, 1200);
        } else {
          signupMessage.innerHTML =
            'Account created. Check your email to confirm it, then ' +
            '<a href="/">log in on the homepage</a>.';
          signupMessage.className = 'msg ok';
        }
      } catch (error) {
        console.error(error);
        signupMessage.textContent = error.message || 'Could not create account.';
        signupMessage.className = 'msg err';
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
