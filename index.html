const CHAPTERS = [
{
  id: &quot;CH14&quot;, code: &quot;AEB&quot;, subject: &quot;Biology&quot;, chapNum: &quot;14&quot;, title: &quot;Pseudocoelomates, Rotifera and Gastrotricha&quot;, free: true,
  notes: [
    {type:&quot;p&quot;, heading:&quot;Pseudocoelomates (Blastocoelomates)&quot;, paras:[
      &quot;Pseudocoelomates are animals with a pseudocoel, a body cavity between the body wall and the digestive tract. Unlike a true coelom, it is not completely lined by mesoderm or peritoneum. The pseudocoel develops from the embryonic blastocoel, contains fluid that suspends and cushions internal organs, and may act as a hydrostatic support system.&quot;,
      &quot;Pseudocoelomates have a complete digestive tract with a mouth and an anus. Most acoelomates lack this; an exception is Nemertea (ribbon worms).&quot;,
      &quot;Main pseudocoelomate groups (acronym RONG NAKED): Rotifera, Nematoda, Gastrotricha, Nematomorpha, Acanthocephala, Kinorhyncha, Entoprocta.&quot;,
      &quot;Entoprocta and Ectoprocta were once grouped under Polyzoa/Bryozoa (\u201cmoss animals\u201d). Ectoprocta have a true coelom, while Entoprocta are pseudocoelomates. They are aquatic invertebrates, commonly sedentary colonial organisms.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Phylum Rotifera&quot;, paras:[
      &quot;Rotifers are tiny, mostly transparent aquatic animals with a ciliated crown called the corona. The beating of the corona creates a rotating-wheel appearance, giving the name \u201crotifer\u201d (wheel animal).&quot;,
      &quot;About 15,000\u201320,000 species exist. Their transparent bodies may appear to take the colour of food in the digestive tract under a microscope. Few species are parasitic, though many are parasitized by fungi or microsporidians such as Bertramia.&quot;,
      &quot;Classes of Rotifera (acronym SBM): Seisonacta, Bdelloidea, Monogononta.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Seisonacta&quot;, paras:[
      &quot;Usually parasites or epizoic forms on crustaceans. Corona poorly developed, bodies elongated. Dioecious (separate males and females) with little sexual dimorphism. Examples: Philodina, Albertia, Cephalodella.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Bdelloidea&quot;, paras:[
      &quot;Retractable anterior end; may swim or creep. Males absent. Reproduce by obligate parthenogenesis (females produce offspring from unfertilized eggs).&quot;]},
    {type:&quot;p&quot;, heading:&quot;Monogononta&quot;, paras:[
      &quot;May be motile or sessile. Name refers to a single reproductive organ. Males generally smaller than females. Produce three egg types: Amictic eggs (develop into females without fertilization), Mictic eggs (unfertilized, may develop into males), Dormant eggs (fertilized, resistant coverings, survive harsh conditions). This pattern is called cyclic parthenogenesis.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Body structure of rotifers&quot;, paras:[
      &quot;1. Head: Bears the corona, aids feeding and movement. Mouth surrounded by a buccal field.&quot;,
      &quot;2. Trunk: Cuticle may thicken into a protective, immovable case called a lorica for support. Sensory antennae may occur dorsally near the front, or laterally/posteriorly.&quot;,
      &quot;3. Foot: In sessile forms, may have an adhesive disc for attachment. In swimming forms, may have toes and pedal glands.&quot;,
      &quot;The pharynx contains a muscular mastax with hard jaws called trophi. The mastax distinguishes rotifers from gastrotrichs. The brain lies dorsal to the mastax.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Phylum Gastrotricha&quot;, paras:[
      &quot;Gastrotrichs (\u201cstomach hairs\u201d) are small, flattened invertebrates about 65\u20135,000 micrometres long. They resemble rotifers but lack a corona and mastax. Bodies may have scales; they produce hard-shelled eggs.&quot;,
      &quot;They form part of the psammolittoral fauna \u2014 animals living in sandy regions around the edges of natural water bodies.&quot;,
      &quot;Marine gastrotrichs are mainly omnivorous; freshwater species commonly feed on bacteria. Scales and resistant eggs help them survive low-oxygen and harsh conditions.&quot;,
      &quot;Their nervous system includes a brain near the pharynx. In freshwater habitats, females are the most commonly encountered individuals.&quot;]}
  ],

[&quot;Where is the brain located in gastrotrichs?&quot;,&quot;Near the pharynx.&quot;]
  ],

{
  id: &quot;Z07&quot;, code: &quot;AEB&quot;, subject: &quot;Zoology&quot;, chapNum: &quot;7&quot;, title: &quot;Metazoans, Mesozoa and Parazoa&quot;, free: false,
  notes: [
    {type:&quot;p&quot;, heading:&quot;Metazoa&quot;, paras:[&quot;Metazoa refers to multicellular animals.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Mesozoa&quot;, paras:[
      &quot;Mesozoans are microscopic, worm-like parasites traditionally grouped into two major groups (mnemonic: DIOR).&quot;]},
    {type:&quot;list&quot;, heading:&quot;The two Mesozoan groups&quot;, ordered:false, items:[
      &quot;Dicyemida: parasites of cephalopods, such as octopuses and squids.&quot;,
      &quot;Orthonectida: parasites of various marine invertebrates, including annelids and echinoderms.&quot;]},
    {type:&quot;list&quot;, heading:&quot;General characteristics of Mesozoa&quot;, ordered:false, items:[
      &quot;Very small, simple body organization.&quot;,
      &quot;An outer layer of ciliated cells surrounds internal reproductive cells.&quot;,
      &quot;They depend on their hosts for survival and reproduction.&quot;,
      &quot;Their classification and evolutionary relationships have been debated.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Parazoa&quot;, paras:[
      &quot;Parazoa traditionally includes sponges, which have a simpler level of organization than most other animals.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Characteristics of sponges&quot;, ordered:false, items:[
      &quot;They lack true tissues and organs.&quot;,
      &quot;They possess specialized cells called choanocytes (collar cells), which generate water currents and trap food.&quot;,
      &quot;They are generally sessile filter feeders.&quot;,
      &quot;Most are marine, although freshwater species exist.&quot;,
      &quot;Many are hermaphroditic.&quot;,
      &quot;Sexual reproduction commonly involves cross-fertilization.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Important term&quot;, paras:[
      &quot;Phoresis: a relationship in which one organism uses another for transport without necessarily harming it.&quot;]}
  ],
  flashcards: [
[&quot;What are Metazoa?&quot;,&quot;Multicellular animals whose bodies are made up of many cells.&quot;],
[&quot;What are Mesozoa, and which two traditional groups are included in them?&quot;,&quot;Mesozoa are microscopic, parasitic organisms traditionally grouped into Dicyemida and Orthonectida.&quot;],
[&quot;Which group of Mesozoa parasitizes cephalopods?&quot;,&quot;Dicyemida. They are commonly found in the kidneys of cephalopods such as octopuses and squids.&quot;],
[&quot;What is the characteristic body organization of Orthonectida?&quot;,&quot;A simple body with an outer layer of ciliated cells surrounding internal reproductive cells.&quot;],
[&quot;What is Parazoa, and what animal group is its main example?&quot;,&quot;A traditional grouping of simple animals lacking true tissues and organs. Sponges (Porifera) are its main example.&quot;],
[&quot;What are choanocytes, and what is their function in sponges?&quot;,&quot;Choanocytes are flagellated collar cells that generate water currents and trap food particles.&quot;],
[&quot;How do sponges commonly reproduce sexually?&quot;,&quot;Many sponges are hermaphroditic and reproduce through cross-fertilization, in which sperm from one individual fertilizes eggs of another.&quot;]

{
  id: &quot;Z08&quot;, code: &quot;AEB&quot;, subject: &quot;Zoology&quot;, chapNum: &quot;8&quot;, title: &quot;Eumetazoa&quot;, free: false,
  notes: [
    {type:&quot;p&quot;, heading:&quot;Eumetazoa&quot;, paras:[&quot;Eumetazoans are animals with true tissues and greater cellular specialization.&quot;]},
    {type:&quot;table&quot;, heading:&quot;Classification by symmetry (mnemonic: RABIT)&quot;, headers:[&quot;Group&quot;,&quot;Symmetry&quot;], rows:[
      [&quot;Radiata&quot;,&quot;Radial symmetry&quot;], [&quot;Bilateria&quot;,&quot;Bilateral symmetry&quot;]]},
    {type:&quot;p&quot;, heading:&quot;&quot;, paras:[
      &quot;Radiata traditionally includes animals with radial symmetry, while Bilateria includes animals whose bodies can be divided into approximately equal right and left halves.&quot;,
      &quot;Most radiates are diploblastic, possessing two primary germ layers. Bilaterians are generally triploblastic, possessing three germ layers.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Cnidaria and related animals&quot;, paras:[
      &quot;Traditional introductory zoology notes often group coelenterates and related organisms under the heading of Radiata.&quot;]},
    {type:&quot;list&quot;, heading:&quot;General characteristics of cnidarians&quot;, ordered:false, items:[
      &quot;Diploblastic, with an outer epidermis and inner gastrodermis.&quot;,
      &quot;Possess a gastrovascular cavity called the enteron.&quot;,
      &quot;The mouth usually serves as the only opening to the digestive cavity.&quot;,
      &quot;They have a gelatinous mesoglea between the tissue layers.&quot;,
      &quot;They exhibit extracellular digestion followed by intracellular digestion.&quot;,
      &quot;The planula is a common free-swimming larval stage.&quot;]},
    {type:&quot;p&quot;, heading:&quot;&quot;, paras:[
      &quot;Polyp: sessile, cylindrical body form. Medusa: usually free-swimming, umbrella-shaped body form. Some cnidarians have both polyp and medusa stages, while others have only one.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Classes of Cnidaria (mnemonic: HAS)&quot;, ordered:false, items:[
      &quot;Hydrozoa \u2014 many have a dominant polyp stage; some form colonies, and many have a medusa stage. Examples: Hydra and Obelia.&quot;,
      &quot;Anthozoa \u2014 includes sea anemones and corals; only the polyp stage, no medusa stage.&quot;,
      &quot;Scyphozoa \u2014 the true jellyfish; the medusa is the dominant stage; many possess stinging cells.&quot;]},
    {type:&quot;table&quot;, heading:&quot;Anthozoan subclasses&quot;, headers:[&quot;Subclass&quot;,&quot;Characteristics&quot;], rows:[
      [&quot;Zoantharia&quot;,&quot;Commonly have numerous unbranched tentacles; includes sea anemones.&quot;],
      [&quot;Alcyonaria&quot;,&quot;Have eight pinnate tentacles; includes many soft corals.&quot;]]},
    {type:&quot;p&quot;, heading:&quot;&quot;, paras:[
      &quot;Coral reefs are often called the rainforests of the sea because they support diverse marine communities.&quot;,
      &quot;Many reef-building corals have a symbiotic relationship with photosynthetic algae called zooxanthellae. The algae provide organic nutrients through photosynthesis, while the coral provides shelter and access to light.&quot;]},
    {type:&quot;correction&quot;, heading:&quot;Important correction: comb jellies&quot;, text:
      &quot;Ctenophores, or comb jellies, are not cnidarians. They possess adhesive cells called colloblasts, which capture prey. Many species are bioluminescent, meaning they can produce light. They do not possess the stinging cells characteristic of cnidarians.&quot;}
  ],
  flashcards: [
[&quot;What are Eumetazoa?&quot;,&quot;Animals with true tissues and specialized cells.&quot;],
[&quot;What is the difference between Radiata and Bilateria?&quot;,&quot;Radiata traditionally refers to animals with radial symmetry, while Bilateria refers to animals with bilateral symmetry.&quot;],
[&quot;What is the difference between diploblastic and triploblastic animals?&quot;,&quot;Diploblastic animals develop from two primary germ layers: ectoderm and endoderm. Triploblastic animals have three: ectoderm, mesoderm and endoderm.&quot;],
[&quot;What is the gastrovascular cavity, and what is its function?&quot;,&quot;A digestive cavity that carries out digestion and distributes nutrients. In many simple animals, it has a single opening serving as the mouth.&quot;],
[&quot;What is mesoglea?&quot;,&quot;A gelatinous layer between the epidermis and gastrodermis in cnidarians. Its thickness and cellular composition vary among groups.&quot;],
[&quot;What is the difference between a polyp and a medusa?&quot;,&quot;A polyp is generally sessile and cylindrical, while a medusa is usually free-swimming and umbrella-shaped.&quot;],
[&quot;What is a planula larva?&quot;,&quot;A typically ciliated, free-swimming larval stage of cnidarians that may settle and develop into a polyp.&quot;],
[&quot;What are the three traditional classes of Cnidaria, and what does the mnemonic HAS represent?&quot;,&quot;Hydrozoa, Anthozoa and Scyphozoa.&quot;],
[&quot;Which cnidarian class has only the polyp stage, with no medusa stage?&quot;,&quot;Anthozoa, which includes sea anemones and corals.&quot;],
[&quot;What are colloblasts, and which animals possess them?&quot;,&quot;Adhesive cells used to capture prey, found in ctenophores (comb jellies). They are not stinging cells.&quot;],
[&quot;What are zooxanthellae, and how do they benefit reef-building corals?&quot;,&quot;Symbiotic photosynthetic algae that provide organic nutrients to corals through photosynthesis. Corals provide them with shelter and access to light.&quot;]
], mcqs: [

{
  id: &quot;Z09&quot;, code: &quot;AEB&quot;, subject: &quot;Zoology&quot;, chapNum: &quot;9&quot;, title: &quot;Acoelomates and body cavities&quot;, free: false,
  notes: [
    {type:&quot;table&quot;, heading:&quot;The three major body-cavity conditions&quot;, headers:[&quot;Type&quot;,&quot;Description&quot;], rows:[
      [&quot;Acoelomate&quot;,&quot;No body cavity between the gut and body wall; the space is filled with tissue.&quot;],
      [&quot;Pseudocoelomate&quot;,&quot;A body cavity exists but is not completely lined by mesoderm-derived peritoneum.&quot;],
      [&quot;Coelomate&quot;,&quot;A true body cavity is completely lined by mesoderm-derived tissue.&quot;]]},
    {type:&quot;p&quot;, heading:&quot;Formation of the body cavity&quot;, paras:[
      &quot;During embryonic development, the blastocoel is the initial cavity of the blastula. As gastrulation proceeds, cells move inward and the archenteron (primitive gut) forms.&quot;,
      &quot;In acoelomates, the space between the body wall and gut becomes filled with tissue. In pseudocoelomates, part of the original blastocoel persists as the body cavity. In coelomates, a true coelom develops within mesoderm.&quot;,
      &quot;The blastopore is the opening of the developing archenteron.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Haemocoel&quot;, paras:[
      &quot;In many arthropods, the main body cavity is a haemocoel, containing circulating haemolymph. It is associated with an open circulatory system and is not equivalent to a true coelom.&quot;]},
    {type:&quot;table&quot;, heading:&quot;Examples by body-cavity type&quot;, headers:[&quot;Body-cavity type&quot;,&quot;Examples&quot;], rows:[
      [&quot;Acoelomates&quot;,&quot;Platyhelminthes&quot;],
      [&quot;Pseudocoelomates&quot;,&quot;Nematodes, rotifers&quot;],
      [&quot;Coelomates&quot;,&quot;Annelids, molluscs, arthropods, echinoderms&quot;]]},
    {type:&quot;correction&quot;, heading:&quot;Note&quot;, text:
      &quot;These are traditional introductory classifications. Modern taxonomy recognizes more complex relationships among the groups.&quot;}
  ],
  flashcards: [
[&quot;What is an acoelomate?&quot;,&quot;A triploblastic animal that lacks a body cavity between the digestive tract and body wall. The space is filled with tissue.&quot;],
[&quot;What is a pseudocoelomate?&quot;,&quot;An animal with a fluid-filled body cavity that is not completely lined by mesoderm-derived tissue.&quot;],
[&quot;What is a coelomate?&quot;,&quot;An animal with a true body cavity completely lined by mesoderm-derived tissue.&quot;],
[&quot;What is the blastocoel?&quot;,&quot;The cavity within the early embryo at the blastula stage. It may persist in pseudocoelomates or be reduced during development.&quot;],
[&quot;What is the archenteron, and what is the blastopore?&quot;,&quot;The archenteron is the primitive gut formed during gastrulation. The blastopore is its opening to the outside.&quot;],
[&quot;What is a haemocoel?&quot;,&quot;A body cavity containing haemolymph in animals with an open circulatory system, such as most arthropods.&quot;],
[&quot;Give one example each of an acoelomate, pseudocoelomate and coelomate.&quot;,&quot;Acoelomate: Platyhelminthes. Pseudocoelomate: Nematoda. Coelomate: Annelida.&quot;]
], mcqs: [
[&quot;An animal with no body cavity between the gut and body wall is:&quot;,[&quot;Acoelomate&quot;,&quot;Pseudocoelomate&quot;,&quot;Coelomate&quot;,&quot;Haemocoelomate&quot;],0],

[&quot;The initial cavity of the blastula is the:&quot;,[&quot;Archenteron&quot;,&quot;Blastocoel&quot;,&quot;Enteron&quot;,&quot;Haemocoel&quot;],1],
[&quot;The primitive gut formed during gastrulation is the:&quot;,[&quot;Blastocoel&quot;,&quot;Archenteron&quot;,&quot;Pseudocoel&quot;,&quot;Haemocoel&quot;],1],
[&quot;The blastopore is the:&quot;,[&quot;Opening of the developing archenteron&quot;,&quot;Adult digestive opening of all animals&quot;,&quot;Mesoderm lining of the coelom&quot;,&quot;Fluid inside the haemocoel&quot;],0],

      &quot;Example: Diclidophora merlangi, a parasite of fish gills.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Digenea&quot;, ordered:false, items:[
      &quot;Usually require two or more hosts to complete their life cycle.&quot;,
      &quot;Typically possess oral and ventral suckers; the ventral sucker is called the acetabulum.&quot;,
      &quot;Most are hermaphroditic, but Schistosoma species are dioecious.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Aspidogastrea&quot;, ordered:false, items:[
      &quot;A relatively small group of trematodes.&quot;,
      &quot;Possess a large attachment organ, often divided into suckers or alveoli.&quot;,
      &quot;Commonly parasitize molluscs and some vertebrates, including fish and turtles.&quot;,
      &quot;Generally have simpler life cycles than digeneans, often involving a single host.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Important trematode infections&quot;, paras:[
      &quot;Schistosomiasis \u2014 caused by blood flukes of the genus Schistosoma. Infection occurs when infective cercariae penetrate the skin in contaminated freshwater. S. mansoni: mainly intestinal and hepatic disease. S. japonicum: mainly intestinal and hepatic disease. S. haematobium: primarily urinary tract disease.&quot;,
      &quot;Fascioliasis \u2014 caused by Fasciola hepatica, the common liver fluke. It primarily affects the liver and bile ducts.&quot;,
      &quot;Paragonimiasis \u2014 caused by Paragonimus westermani and related lung flukes. Infection usually follows ingestion of inadequately cooked infected crustaceans.&quot;]},
    {type:&quot;correction&quot;, heading:&quot;Important correction&quot;, text:
      &quot;Schistosoma mansoni and S. japonicum are not restricted to the large and small intestines respectively. Their adult worms live in blood vessels, and disease is associated with eggs deposited in tissues. S. haematobium is associated mainly with the urinary bladder and urinary tract, not simply the blood.&quot;}
  ],

{
  id: &quot;Z15&quot;, code: &quot;AEB&quot;, subject: &quot;Zoology&quot;, chapNum: &quot;15&quot;, title: &quot;Nematoda&quot;, free: false,
  notes: [
    {type:&quot;list&quot;, heading:&quot;15.1 General characteristics&quot;, ordered:false, items:[
      &quot;Cylindrical, elongated, unsegmented bodies, usually tapered at both ends.&quot;,
      &quot;Body covered by a tough, non-cellular cuticle.&quot;,
      &quot;Bilaterally symmetrical and triploblastic.&quot;,
      &quot;Possess a pseudocoelom, a fluid-filled body cavity not completely lined by mesoderm.&quot;,
      &quot;Most species have separate sexes (dioecious), with males and females showing sexual dimorphism.&quot;,
      &quot;Excretion occurs through longitudinal excretory canals or glandular structures, depending on the group.&quot;,
      &quot;Many species are parasites of humans, animals, or plants and are economically important because they cause disease.&quot;]},
    {type:&quot;table&quot;, heading:&quot;15.2 Classification by excretory system&quot;, headers:[&quot;Group&quot;,&quot;Excretory structure&quot;], rows:[
      [&quot;Secernentea&quot;,&quot;Tubular or canal-based excretory system&quot;], [&quot;Adenophorea&quot;,&quot;Glandular excretory system&quot;]]},
    {type:&quot;correction&quot;, heading:&quot;Note&quot;, text:&quot;These are traditional classifications used in older zoology texts. Modern classifications use different group names.&quot;},
    {type:&quot;p&quot;, heading:&quot;15.3 General life cycle&quot;, paras:[
      &quot;The typical nematode life cycle: Egg \u2192 Larval stages \u2192 Adult.&quot;,
      &quot;Nematodes usually undergo four moults as they develop through four juvenile stages (L1\u2013L4) before becoming adults. The exact duration varies by species and environmental conditions.&quot;,
      &quot;The infective stage also varies: some infective larvae enter the host directly through the skin or mouth; some nematodes infect humans through ingestion of eggs containing larvae; others require an intermediate host, such as a mosquito.&quot;]},
    {type:&quot;table&quot;, heading:&quot;15.4 Modes of transmission&quot;, headers:[&quot;Type&quot;,&quot;Explanation&quot;], rows:[
      [&quot;Active infection&quot;,&quot;The infective larva actively penetrates the host, usually through the skin.&quot;],
      [&quot;Passive infection&quot;,&quot;The host ingests infective eggs or larvae in food, water, or other materials.&quot;],
      [&quot;Vector-borne infection&quot;,&quot;A vector transmits the parasite to the host.&quot;]]},
    {type:&quot;list&quot;, heading:&quot;15.5 Types of transmission by vectors&quot;, ordered:false, items:[
      &quot;Mechanical transmission: the vector carries the parasite without the parasite developing or multiplying inside it.&quot;,
      &quot;Biological transmission: the parasite develops, multiplies, or both within the vector.&quot;,
      &quot;Cyclodevelopmental transmission: the parasite develops within the vector but does not multiply.&quot;,
      &quot;Cyclopropagative transmission: the parasite both develops and multiplies within the vector.&quot;]},
    {type:&quot;p&quot;, heading:&quot;15.6 Ascaris lumbricoides \u2014 Roundworm&quot;, paras:[&quot;Disease: Ascariasis.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Characteristics&quot;, ordered:false, items:[
      &quot;Adult worms are large, cylindrical, and unsegmented.&quot;,
      &quot;The mouth has three well-developed lips, each bearing two papillae.&quot;,
      &quot;Males are smaller than females and have a curved posterior end with caudal papillae and two copulatory spicules.&quot;,
      &quot;A female can produce approximately 200,000\u2013240,000 eggs per day.&quot;,
      &quot;Eggs have thick, resistant shells and can survive in suitable environmental conditions for years.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Life cycle&quot;, ordered:true, items:[
      &quot;Humans ingest embryonated eggs in contaminated food, water, or soil.&quot;,
      &quot;Larvae hatch in the small intestine and penetrate the intestinal wall.&quot;,
      &quot;They travel through the hepatic portal circulation to the liver, then through the heart to the lungs.&quot;,
      &quot;Larvae enter the alveoli, move up the respiratory tract, and are swallowed.&quot;,
      &quot;They return to the small intestine, where they mature into adults.&quot;]},
    {type:&quot;p&quot;, heading:&quot;&quot;, paras:[&quot;Infective stage: embryonated egg containing the second-stage larva (L2).&quot;]},
    {type:&quot;correction&quot;, heading:&quot;Important distinction&quot;, text:&quot;Ascaris suum is primarily associated with pigs. Ascaris lumbricoides is the principal human roundworm.&quot;},
    {type:&quot;list&quot;, heading:&quot;Other examples of nematode migration&quot;, ordered:false, items:[
      &quot;Ascaris suum: may undergo tracheal migration, similar to A. lumbricoides.&quot;,
      &quot;Toxocara canis: undergoes somatic migration in humans, with larvae travelling to tissues and not normally developing into adults.&quot;,
      &quot;Parascaris equorum: primarily a parasite of horses and undergoes tracheal migration.&quot;]},
    {type:&quot;p&quot;, heading:&quot;15.7 Hookworm \u2014 Ancylostoma duodenale&quot;, paras:[
      &quot;Disease: Hookworm infection (ancylostomiasis). The name comes from Greek: ankylos means bent or hooked, while stoma means mouth.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Characteristics&quot;, ordered:false, items:[
      &quot;Has a well-developed buccal capsule with teeth.&quot;,
      &quot;The anterior end is bent dorsally.&quot;,
      &quot;Adults attach to the small intestinal wall and feed on blood.&quot;,
      &quot;Males and females are separate.&quot;,
      &quot;Females possess two ovaries.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Life cycle&quot;, ordered:true, items:[
      &quot;Eggs are passed in faeces.&quot;,
      &quot;In warm, moist, oxygenated soil, eggs hatch into rhabditiform larvae (L1).&quot;,
      &quot;Larvae moult to L2 and then to the infective filariform larva (L3).&quot;,
      &quot;L3 larvae penetrate the skin, enter the circulation, and travel through the heart to the lungs.&quot;,
      &quot;They migrate up the trachea, are swallowed, and reach the small intestine.&quot;,
      &quot;They mature into adults and begin producing eggs.&quot;]},
    {type:&quot;correction&quot;, heading:&quot;Important correction&quot;, text:&quot;The infective stage is the filariform larva (L3) specifically \u2014 not simply any sheathed larval stage. The sheath helps protect the larva in the environment.&quot;},
    {type:&quot;p&quot;, heading:&quot;Environmental conditions&quot;, paras:[
      &quot;Eggs and larvae develop best in warm, moist, aerated soil. Very low temperatures and unsuitable moisture conditions prevent development or reduce survival. Larval development is strongly influenced by temperature and environmental conditions.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Infection and migration&quot;, paras:[
      &quot;Infection may occur through the skin or by ingestion. Skin infection: larvae enter the blood, pass through the heart and lungs, and eventually reach the intestine. Oral infection: larvae may reach the intestine directly, although migration patterns vary by species. The adult worms generally mature in the small intestine within several weeks.&quot;]},
    {type:&quot;p&quot;, heading:&quot;15.8 Strongyloides stercoralis&quot;, paras:[
      &quot;Disease: Strongyloidiasis. A widely distributed nematode, especially in warm and humid regions. This parasite has three important developmental pathways.&quot;]},
    {type:&quot;list&quot;, heading:&quot;1. Free-living cycle (heterogonic cycle)&quot;, ordered:false, items:[
      &quot;Rhabditiform larvae develop into free-living adult males and females in suitable soil.&quot;,
      &quot;These adults reproduce sexually.&quot;,
      &quot;Their offspring may develop into infective filariform larvae.&quot;]},
    {type:&quot;list&quot;, heading:&quot;2. Parasitic cycle (homogonic cycle)&quot;, ordered:false, items:[
      &quot;Infective filariform larvae penetrate the skin.&quot;,
      &quot;They migrate through the circulation to the lungs, then up the respiratory tract and are swallowed.&quot;,
      &quot;They reach the small intestine, where parasitic females live in the mucosa.&quot;,
      &quot;Eggs hatch into rhabditiform larvae, which are passed in faeces or develop into infective larvae.&quot;]},
    {type:&quot;p&quot;, heading:&quot;3. Autoinfection&quot;, paras:[
      &quot;Some larvae become infective while still inside the host. They penetrate the intestinal mucosa or perianal skin and reinfect the same person. Autoinfection can cause persistent infection and, particularly in immunocompromised individuals, potentially life-threatening hyperinfection.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Clinical phases&quot;, ordered:false, items:[
      &quot;Cutaneous: itching and skin irritation, especially at the site of entry.&quot;,
      &quot;Pulmonary: cough and other respiratory symptoms during larval migration.&quot;,
      &quot;Intestinal: abdominal pain, diarrhoea, and intestinal inflammation.&quot;]},
    {type:&quot;p&quot;, heading:&quot;&quot;, paras:[&quot;Severe infection may cause intestinal damage and allow bacteria to enter the bloodstream, leading to sepsis.&quot;]},
    {type:&quot;p&quot;, heading:&quot;15.9 Trichuris trichiura \u2014 Whipworm&quot;, paras:[&quot;Disease: Trichuriasis.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Characteristics&quot;, ordered:false, items:[
      &quot;Adult worms inhabit the caecum and adjacent large intestine.&quot;,
      &quot;The anterior end is thin, while the posterior end is thicker, giving the worm a whip-like appearance.&quot;,
      &quot;Eggs are barrel-shaped or lemon-shaped, with characteristic plugs at both ends.&quot;,
      &quot;The egg contains an unsegmented cell when passed in faeces.&quot;,
      &quot;It is a soil-transmitted helminth (geohelminth).&quot;]},
    {type:&quot;p&quot;, heading:&quot;&quot;, paras:[&quot;Infective stage: embryonated egg containing a larva. Humans become infected by ingesting embryonated eggs from contaminated soil, food, or water.&quot;]},
    {type:&quot;p&quot;, heading:&quot;15.10 Trichinella spiralis&quot;, paras:[
      &quot;Disease: Trichinellosis. A parasitic nematode found in pigs and other mammals. Human infection usually occurs by eating raw or inadequately cooked meat containing encysted larvae. The adult worms develop in the small intestine. New larvae migrate through the body and become established in skeletal muscles.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Main stages of infection&quot;, ordered:true, items:[
      &quot;Ingestion of meat containing encysted larvae.&quot;,
      &quot;Release of larvae in the intestine and development into adults.&quot;,
      &quot;Female worms release larvae that penetrate the intestinal mucosa.&quot;,
      &quot;Larvae migrate through the circulation and enter skeletal muscles.&quot;,
      &quot;Larvae become encapsulated in muscle tissue.&quot;]},
    {type:&quot;correction&quot;, heading:&quot;Important distinction&quot;, text:&quot;Trichinella spiralis is not the human pinworm. The human pinworm is Enterobius vermicularis.&quot;}
  ],

{
  id: &quot;Z16&quot;, code: &quot;AEB&quot;, subject: &quot;Zoology&quot;, chapNum: &quot;16&quot;, title: &quot;Filarial worms&quot;, free: false,
  notes: [
    {type:&quot;list&quot;, heading:&quot;16.1 General characteristics&quot;, ordered:false, items:[
      &quot;Filarial worms are slender, elongated nematodes that are usually tissue or blood parasites.&quot;,
      &quot;They have small mouths, generally without lips or a well-developed buccal capsule.&quot;,
      &quot;Their larval forms circulating in the blood or tissues are called microfilariae.&quot;,
      &quot;Adult worms may live in lymphatic vessels, subcutaneous tissues, or body cavities.&quot;,
      &quot;Many species require an arthropod vector to complete their life cycle.&quot;]},
    {type:&quot;table&quot;, heading:&quot;16.2 Medically and veterinary important genera (mnemonic: MAN LOW BD)&quot;, headers:[&quot;Letters&quot;,&quot;Genus&quot;], rows:[
      [&quot;MAN&quot;,&quot;Mansonella&quot;], [&quot;LOW&quot;,&quot;Loa loa&quot;], [&quot;O&quot;,&quot;Onchocerca&quot;], [&quot;W&quot;,&quot;Wuchereria&quot;], [&quot;B&quot;,&quot;Brugia&quot;], [&quot;D&quot;,&quot;Dracunculus&quot;]]},
    {type:&quot;p&quot;, heading:&quot;16.3 Periodicity of microfilariae&quot;, paras:[
      &quot;Periodicity refers to the variation in the number of microfilariae circulating in peripheral blood at different times of the day.&quot;]},
    {type:&quot;table&quot;, heading:&quot;&quot;, headers:[&quot;Type&quot;,&quot;Example&quot;], rows:[
      [&quot;Nocturnal periodicity&quot;,&quot;Wuchereria bancrofti&quot;], [&quot;Diurnal periodicity&quot;,&quot;Loa loa&quot;], [&quot;Non-periodic or aperiodic&quot;,&quot;Some Mansonella species&quot;]]},
    {type:&quot;p&quot;, heading:&quot;&quot;, paras:[&quot;Periodicity is important because it helps determine the appropriate time to collect blood samples for diagnosis.&quot;]},
    {type:&quot;p&quot;, heading:&quot;16.4 Wuchereria bancrofti&quot;, paras:[&quot;Disease: Lymphatic filariasis.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Life cycle&quot;, ordered:true, items:[
      &quot;Adult worms live in human lymphatic vessels.&quot;,
      &quot;Microfilariae enter the bloodstream.&quot;,
      &quot;A mosquito ingests microfilariae during a blood meal.&quot;,
      &quot;Larvae develop into infective L3 inside the mosquito.&quot;,
      &quot;Infective L3 enters a new human host during mosquito feeding.&quot;]},
    {type:&quot;p&quot;, heading:&quot;&quot;, paras:[
      &quot;Female worms are viviparous in the functional sense: they release live microfilariae rather than laying eggs outside the host. Microfilariae are sheathed and usually show nocturnal periodicity. Adult worms may survive for several years.&quot;]},
    {type:&quot;p&quot;, heading:&quot;Pathology&quot;, paras:[
      &quot;Adult worms inhabit the lymphatic vessels and can cause inflammation and impaired lymph drainage. This may result in lymphatic obstruction, lymphoedema (abnormal accumulation of lymph fluid), and elephantiasis, characterized by severe swelling and thickening of affected tissues. The disease is called lymphatic filariasis.&quot;]},
    {type:&quot;p&quot;, heading:&quot;16.5 Dracunculus medinensis \u2014 Guinea worm&quot;, paras:[
      &quot;Disease: Dracunculiasis. A long, thread-like nematode that infects humans and other mammals. The adult female emerges through the skin, usually of the lower limb. When the affected area is immersed in water, the female releases larvae.&quot;]},
    {type:&quot;list&quot;, heading:&quot;Life cycle&quot;, ordered:true, items:[
      &quot;A person drinks water containing infected copepods (Cyclops or water fleas).&quot;,
      &quot;Larvae are released in the digestive tract and penetrate the intestinal wall.&quot;,
      &quot;They develop into adult worms in the tissues.&quot;,
      &quot;The gravid female migrates toward the skin.&quot;,
      &quot;The female emerges through a blister and releases larvae into water.&quot;,
      &quot;Copepods ingest the larvae, which develop into infective larvae.&quot;]},
    {type:&quot;p&quot;, heading:&quot;&quot;, paras:[&quot;Infective stage: L3 larva inside the copepod. Mode of infection: drinking water containing infected copepods.&quot;]}
  ],
  flashcards: [

// ---------- state ----------
let unlocked = false;
try { unlocked = localStorage.getItem(&#39;examprep_unlocked&#39;) === &#39;true&#39;; } catch(e) {}
let currentChapterIdx = 0;
let cardIndex = 0, cardFlipped = false;
let quizIndex = 0, quizScore = 0, quizAnswered = 0;
let chimeneChapterIdx = 0, chimeneQIndex = 0, chimeneScore = 0, chimeneAnswered = 0;

function currentChapter() { return CHAPTERS[currentChapterIdx]; }
function chapterAccessible(ch) { return ch.free || unlocked; }

// ---------- chapter list (vertical) ----------
function renderChapterRail() {
  const list = document.getElementById(&#39;chapter-list&#39;);
  list.innerHTML = CHAPTERS.map((ch, i) =&gt; {
    const locked = !chapterAccessible(ch);
    return `&lt;button class=&quot;list-row&quot; data-idx=&quot;${i}&quot;&gt;
      &lt;span class=&quot;row-label&quot;&gt;${locked ? &#39;&lt;span class=&quot;lock-dot&quot;&gt;&amp;#128274;&lt;/span&gt;&#39; : &#39;&#39;}${ch.code} ${ch.chapNum}${ch.free ? &#39;&lt;span class=&quot;free-tag&quot;&gt;Free&lt;/span&gt;&#39; : &#39;&#39;}&lt;/span&gt;
      &lt;span class=&quot;chevron&quot;&gt;&amp;#8250;&lt;/span&gt;
    &lt;/button&gt;`;
  }).join(&#39;&#39;);
  list.querySelectorAll(&#39;.list-row&#39;).forEach(btn =&gt; {
    btn.addEventListener(&#39;click&#39;, () =&gt; {
      currentChapterIdx = parseInt(btn.dataset.idx);
      cardIndex = 0; cardFlipped = false; quizIndex = 0; quizScore = 0; quizAnswered = 0;
      document.querySelectorAll(&#39;.ctab-btn&#39;).forEach(b =&gt; b.classList.remove(&#39;active&#39;));
      document.querySelectorAll(&#39;.csubpanel&#39;).forEach(p =&gt; p.classList.remove(&#39;active&#39;));
      document.querySelector(&#39;.ctab-btn[data-content=&quot;notes&quot;]&#39;).classList.add(&#39;active&#39;);
      document.getElementById(&#39;content-notes&#39;).classList.add(&#39;active&#39;);
      document.getElementById(&#39;chapters-list-view&#39;).style.display = &#39;none&#39;;
      document.getElementById(&#39;chapters-detail-view&#39;).style.display = &#39;block&#39;;
      renderAll();
    });
  });
}
document.getElementById(&#39;chapter-back-btn&#39;).addEventListener(&#39;click&#39;, () =&gt; {
  document.getElementById(&#39;chapters-detail-view&#39;).style.display = &#39;none&#39;;
  document.getElementById(&#39;chapters-list-view&#39;).style.display = &#39;block&#39;;
  renderChapterRail();
});

// ---------- practice list (vertical) ----------
function renderPracticeList() {
  const list = document.getElementById(&#39;practice-list&#39;);
  const items = [
    { key: &#39;quiz&#39;, label: &#39;Quiz&#39; },
    { key: &#39;chimene&#39;, label: &#39;Chimene MCQs&#39; },
    { key: &#39;past&#39;, label: &#39;Past Questions&#39; }
  ];
  list.innerHTML = items.map(it =&gt; `&lt;button class=&quot;list-row&quot; data-key=&quot;${it.key}&quot;&gt;
      &lt;span class=&quot;row-label&quot;&gt;${it.label}&lt;/span&gt;
      &lt;span class=&quot;chevron&quot;&gt;&amp;#8250;&lt;/span&gt;
    &lt;/button&gt;`).join(&#39;&#39;);
  list.querySelectorAll(&#39;.list-row&#39;).forEach(btn =&gt; {
    btn.addEventListener(&#39;click&#39;, () =&gt; {
      const key = btn.dataset.key;
      document.querySelectorAll(&#39;#practice-detail-view .subpanel&#39;).forEach(p =&gt; p.classList.remove(&#39;active&#39;));
      document.getElementById(`subpanel-pq-${key}`).classList.add(&#39;active&#39;);
      document.getElementById(&#39;practice-list-view&#39;).style.display = &#39;none&#39;;
      document.getElementById(&#39;practice-detail-view&#39;).style.display = &#39;block&#39;;
      renderAll();
    });
  });
}
document.getElementById(&#39;practice-back-btn&#39;).addEventListener(&#39;click&#39;, () =&gt; {
  document.getElementById(&#39;practice-detail-view&#39;).style.display = &#39;none&#39;;
  document.getElementById(&#39;practice-list-view&#39;).style.display = &#39;block&#39;;
});

// ---------- header ----------
function renderHeader() {
  const ch = currentChapter();
  document.getElementById(&#39;chapter-eyebrow&#39;).textContent = `${ch.subject} \u00b7 Chapter ${ch.chapNum}`;
  document.getElementById(&#39;chapter-title&#39;).textContent = ch.title;
}

// ---------- notes ----------
function renderNoteBlock(block) {
  if (block.type === &#39;p&#39;) {
    return `&lt;div class=&quot;note-block&quot;&gt;${block.heading ? `&lt;h2&gt;${block.heading}&lt;/h2&gt;` : &#39;&#39;}${(block.paras||[]).map(p =&gt; `&lt;p&gt;${p}&lt;/p&gt;`).join(&#39;&#39;)}&lt;/div&gt;`;
  }
  if (block.type === &#39;list&#39;) {
    const tag = block.ordered ? &#39;ol&#39; : &#39;ul&#39;;
    return `&lt;div class=&quot;note-block&quot;&gt;${block.heading ? `&lt;h2&gt;${block.heading}&lt;/h2&gt;` : &#39;&#39;}&lt;${tag}&gt;${block.items.map(i =&gt; `&lt;li&gt;${i}&lt;/li&gt;`).join(&#39;&#39;)}&lt;/${tag}&gt;&lt;/div&gt;`;
  }
  if (block.type === &#39;table&#39;) {
    return `&lt;div class=&quot;note-block&quot;&gt;${block.heading ? `&lt;h2&gt;${block.heading}&lt;/h2&gt;` : &#39;&#39;}&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;note-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;${block.headers.map(h =&gt; `&lt;th&gt;${h}&lt;/th&gt;`).join(&#39;&#39;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${block.rows.map(r =&gt; `&lt;tr&gt;${r.map(c =&gt; `&lt;td&gt;${c}&lt;/td&gt;`).join(&#39;&#39;)}&lt;/tr&gt;`).join(&#39;&#39;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;`;
  }
  if (block.type === &#39;correction&#39;) {
    return `&lt;div class=&quot;correction&quot;&gt;&lt;strong&gt;${block.heading}:&lt;/strong&gt; ${block.text}&lt;/div&gt;`;
  }
  if (block.type === &#39;checklist&#39;) {
    return `&lt;div class=&quot;note-block&quot;&gt;&lt;h2&gt;${block.heading}&lt;/h2&gt;
      &lt;p class=&quot;checklist-progress&quot; id=&quot;checklist-progress&quot;&gt;0/${block.items.length} reviewed&lt;/p&gt;
      ${block.items.map((it, i) =&gt; `
        &lt;label class=&quot;checklist-item&quot; id=&quot;check-item-${i}&quot;&gt;
          &lt;input type=&quot;checkbox&quot; data-i=&quot;${i}&quot;&gt;
          &lt;span&gt;${it}&lt;/span&gt;
        &lt;/label&gt;`).join(&#39;&#39;)}
    &lt;/div&gt;`;
  }
  return &#39;&#39;;
}

function renderNotes() {
  const ch = currentChapter();
  const el = document.getElementById(&#39;panel-notes&#39;);
  if (!chapterAccessible(ch)) {
    el.innerHTML = lockBoxHTML(&#39;notes&#39;);
    attachUnlockHandlers();
    return;
  }
  el.innerHTML = ch.notes.map(renderNoteBlock).join(&#39;&#39;);
  const checkboxes = el.querySelectorAll(&#39;.checklist-item input&#39;);
  if (checkboxes.length) {
    checkboxes.forEach(cb =&gt; {
      cb.addEventListener(&#39;change&#39;, () =&gt; {
        const item = document.getElementById(`check-item-${cb.dataset.i}`);
        item.classList.toggle(&#39;checked&#39;, cb.checked);
        const total = checkboxes.length;
        const done = el.querySelectorAll(&#39;.checklist-item input:checked&#39;).length;
        document.getElementById(&#39;checklist-progress&#39;).textContent = `${done}/${total} reviewed`;
      });
    });
  }
}

// ---------- flashcards ----------
function renderFlashcard() {
  const ch = currentChapter();
  const wrap = document.getElementById(&#39;cards-inner&#39;);
  if (!chapterAccessible(ch)) { wrap.innerHTML = lockBoxHTML(&#39;cards&#39;); attachUnlockHandlers(); return; }
  if (!ch.flashcards.length) {
    wrap.innerHTML = `&lt;div class=&quot;empty-state&quot;&gt;&lt;div class=&quot;icon&quot;&gt;&amp;#128218;&lt;/div&gt;&lt;p&gt;Flashcards for this chapter are coming soon.&lt;/p&gt;&lt;/div&gt;`;
    return;
  }
  const [q, a] = ch.flashcards[cardIndex];
  wrap.innerHTML = `
    &lt;div class=&quot;progress-row&quot;&gt;
      &lt;span&gt;Card ${cardIndex + 1} of ${ch.flashcards.length}&lt;/span&gt;
      &lt;span&gt;${cardFlipped ? &#39;Tap to see question&#39; : &#39;Tap to reveal answer&#39;}&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;progress-track&quot;&gt;&lt;div class=&quot;progress-fill&quot; style=&quot;width:${(cardIndex + 1) / ch.flashcards.length * 100}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;flashcard ${cardFlipped ? &#39;answer&#39; : &#39;&#39;}&quot; id=&quot;flip-card&quot;&gt;
      &lt;div class=&quot;content&quot;&gt;${cardFlipped ? a : q}&lt;span class=&quot;hint&quot;&gt;${cardFlipped ? &#39;(Answer)&#39; : &#39;(Question \u2014 tap card)&#39;}&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card-nav&quot;&gt;
      &lt;button id=&quot;card-prev&quot; ${cardIndex === 0 ? &#39;disabled&#39; : &#39;&#39;}&gt;Previous&lt;/button&gt;
      &lt;button id=&quot;card-next&quot; ${cardIndex === ch.flashcards.length - 1 ? &#39;disabled&#39; : &#39;&#39;}&gt;Next&lt;/button&gt;
    &lt;/div&gt;`;
  document.getElementById(&#39;flip-card&#39;).addEventListener(&#39;click&#39;, () =&gt; { cardFlipped = !cardFlipped; renderFlashcard(); });
  document.getElementById(&#39;card-prev&#39;).addEventListener(&#39;click&#39;, () =&gt; { if (cardIndex &gt; 0) { cardIndex--; cardFlipped = false; renderFlashcard(); } });
  document.getElementById(&#39;card-next&#39;).addEventListener(&#39;click&#39;, () =&gt; { if (cardIndex &lt; ch.flashcards.length - 1) { cardIndex++; cardFlipped = false; renderFlashcard(); } });
}

// ---------- combined practice pool ----------
function combinedQuizPool() {
  const pool = [];
  CHAPTERS.forEach(ch =&gt; {
    if (!chapterAccessible(ch)) return;
    ch.mcqs.forEach(mcq =&gt; pool.push({ chapterLabel: `${ch.subject} \u00b7 Ch ${ch.chapNum}`, q: mcq[0], options: mcq[1], correctIdx: mcq[2] }));
  });
  return pool;
}
function totalMcqCountAll() {
  return CHAPTERS.reduce((sum, ch) =&gt; sum + ch.mcqs.length, 0);
}

// ---------- quiz (combined across chapters) ----------
function renderQuiz() {
  const wrap = document.getElementById(&#39;quiz-inner&#39;);
  const pool = combinedQuizPool();
  if (!pool.length) {
    wrap.innerHTML = `&lt;div class=&quot;empty-state&quot;&gt;&lt;div class=&quot;icon&quot;&gt;&amp;#10067;&lt;/div&gt;&lt;p&gt;No quiz questions available yet.&lt;/p&gt;&lt;/div&gt;`;
    return;
  }
  if (quizIndex &gt;= pool.length) quizIndex = 0;
  const item = pool[quizIndex];
  const teaser = (!unlocked &amp;&amp; totalMcqCountAll() &gt; pool.length)
    ? `&lt;div style=&quot;margin-top:18px&quot;&gt;${lockBoxHTML(&#39;quiz&#39;)}&lt;/div&gt;` : &#39;&#39;;
  wrap.innerHTML = `
    &lt;div class=&quot;progress-row&quot;&gt;
      &lt;span&gt;Question ${quizIndex + 1} of ${pool.length}&lt;/span&gt;
      &lt;span class=&quot;quiz-score&quot;&gt;Score: ${quizScore}/${quizAnswered}&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;progress-track&quot;&gt;&lt;div class=&quot;progress-fill&quot; style=&quot;width:${(quizIndex + 1) / pool.length * 100}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;span class=&quot;qtag&quot;&gt;${item.chapterLabel}&lt;/span&gt;
    &lt;p class=&quot;quiz-question&quot;&gt;${item.q}&lt;/p&gt;
    &lt;div id=&quot;options-wrap&quot;&gt;${item.options.map((opt, i) =&gt; `&lt;button class=&quot;option&quot; data-i=&quot;${i}&quot;&gt;${opt}&lt;/button&gt;`).join(&#39;&#39;)}&lt;/div&gt;
    &lt;div class=&quot;quiz-footer&quot;&gt;&lt;button class=&quot;next-btn&quot; id=&quot;quiz-next&quot; disabled&gt;Next question&lt;/button&gt;&lt;/div&gt;
    ${teaser}`;

  const optionBtns = wrap.querySelectorAll(&#39;.option&#39;);
  optionBtns.forEach(btn =&gt; {
    btn.addEventListener(&#39;click&#39;, () =&gt; {
      optionBtns.forEach(b =&gt; b.disabled = true);
      const chosen = parseInt(btn.dataset.i);
      if (chosen === item.correctIdx) { btn.classList.add(&#39;correct&#39;); quizScore++; }
      else { btn.classList.add(&#39;wrong&#39;); optionBtns[item.correctIdx].classList.add(&#39;correct&#39;); }
      quizAnswered++;
      wrap.querySelector(&#39;.quiz-score&#39;).textContent = `Score: ${quizScore}/${quizAnswered}`;
      document.getElementById(&#39;quiz-next&#39;).disabled = false;
    });
  });
  document.getElementById(&#39;quiz-next&#39;).addEventListener(&#39;click&#39;, () =&gt; {
    if (quizIndex &lt; pool.length - 1) { quizIndex++; renderQuiz(); }
  });
  attachUnlockHandlers();
}

// ---------- past questions (combined across chapters) ----------
function renderPast() {
  const wrap = document.getElementById(&#39;past-inner&#39;);
  const items = [];
  CHAPTERS.forEach(ch =&gt; {
    if (!chapterAccessible(ch)) return;
    ch.pastQuestions.forEach(pq =&gt; items.push({ chapterLabel: `${ch.subject} \u00b7 Ch ${ch.chapNum}`, ...pq }));
  });
  const teaser = !unlocked ? lockBoxHTML(&#39;past&#39;) : &#39;&#39;;
  if (!items.length) {
    wrap.innerHTML = `&lt;div class=&quot;empty-state&quot;&gt;&lt;div class=&quot;icon&quot;&gt;&amp;#128196;&lt;/div&gt;&lt;p&gt;No past questions added yet.&lt;/p&gt;&lt;/div&gt;${teaser}`;
    attachUnlockHandlers();
    return;
  }
  wrap.innerHTML = items.map(pq =&gt; `&lt;div class=&quot;note-block&quot;&gt;&lt;span class=&quot;qtag&quot;&gt;${pq.chapterLabel} \u00b7 ${pq.year}&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Q:&lt;/strong&gt; ${pq.q}&lt;/p&gt;&lt;p&gt;${pq.a}&lt;/p&gt;&lt;/div&gt;`).join(&#39;&#39;) + teaser;
  attachUnlockHandlers();
}

// ---------- Chimene MCQs (chapter-by-chapter, credited to Chimene) ----------
function renderChimene() {
  const wrap = document.getElementById(&#39;chimene-inner&#39;);
  if (!unlocked) { wrap.innerHTML = lockBoxHTML(&#39;chimene&#39;); attachUnlockHandlers(); return; }

  const chip = CHIMENE_CHAPTERS.map((c, i) =&gt; `&lt;button class=&quot;chip ${i === chimeneChapterIdx ? &#39;active&#39; : &#39;&#39;}&quot; data-cidx=&quot;${i}&quot;&gt;${c.code} ${c.num}&lt;/button&gt;`).join(&#39;&#39;);
  const ch = CHIMENE_CHAPTERS[chimeneChapterIdx];
  if (chimeneQIndex &gt;= ch.questions.length) chimeneQIndex = 0;
  const item = ch.questions[chimeneQIndex];

  wrap.innerHTML = `
    &lt;div class=&quot;chapter-rail&quot; style=&quot;padding:0 0 14px;border-bottom:none&quot; id=&quot;chimene-rail&quot;&gt;${chip}&lt;/div&gt;
    &lt;p style=&quot;font-size:13px;color:var(--ink-soft);margin:0 0 14px;&quot;&gt;${ch.title} \u2014 credited to Chimene&lt;/p&gt;
    &lt;div class=&quot;progress-row&quot;&gt;
      &lt;span&gt;Question ${chimeneQIndex + 1} of ${ch.questions.length}&lt;/span&gt;
      &lt;span class=&quot;quiz-score&quot;&gt;Score: ${chimeneScore}/${chimeneAnswered}&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;progress-track&quot;&gt;&lt;div class=&quot;progress-fill&quot; style=&quot;width:${(chimeneQIndex + 1) / ch.questions.length * 100}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;quiz-question&quot;&gt;${item[0]}&lt;/p&gt;
    &lt;div id=&quot;chimene-options-wrap&quot;&gt;${item[1].map((opt, i) =&gt; `&lt;button class=&quot;option&quot; data-i=&quot;${i}&quot;&gt;${opt}&lt;/button&gt;`).join(&#39;&#39;)}&lt;/div&gt;
    &lt;div class=&quot;quiz-footer&quot;&gt;&lt;button class=&quot;next-btn&quot; id=&quot;chimene-next&quot; disabled&gt;Next question&lt;/button&gt;&lt;/div&gt;`;

  wrap.querySelectorAll(&#39;#chimene-rail .chip&#39;).forEach(btn =&gt; {
    btn.addEventListener(&#39;click&#39;, () =&gt; {
      chimeneChapterIdx = parseInt(btn.dataset.cidx);
      chimeneQIndex = 0; chimeneScore = 0; chimeneAnswered = 0;
      renderChimene();
    });
  });

  const optionBtns = wrap.querySelectorAll(&#39;#chimene-options-wrap .option&#39;);
  optionBtns.forEach(btn =&gt; {
    btn.addEventListener(&#39;click&#39;, () =&gt; {
      optionBtns.forEach(b =&gt; b.disabled = true);
      const chosen = parseInt(btn.dataset.i);
      if (chosen === item[2]) { btn.classList.add(&#39;correct&#39;); chimeneScore++; }
      else { btn.classList.add(&#39;wrong&#39;); optionBtns[item[2]].classList.add(&#39;correct&#39;); }
      chimeneAnswered++;
      wrap.querySelector(&#39;.quiz-score&#39;).textContent = `Score: ${chimeneScore}/${chimeneAnswered}`;
      document.getElementById(&#39;chimene-next&#39;).disabled = false;
    });
  });
  document.getElementById(&#39;chimene-next&#39;).addEventListener(&#39;click&#39;, () =&gt; {
    if (chimeneQIndex &lt; ch.questions.length - 1) { chimeneQIndex++; renderChimene(); }
  });
}

// ---------- paywall ----------
function lockBoxHTML(context) {
  return `
    &lt;div class=&quot;lock-box&quot;&gt;
      &lt;div class=&quot;icon&quot;&gt;&amp;#128274;&lt;/div&gt;
      &lt;h3&gt;A &amp;#8358;200 token is required&lt;/h3&gt;
      &lt;p&gt;This chapter is part of the full pack. Pay once below, then enter the code your admin sends you to unlock every chapter.&lt;/p&gt;
      &lt;a class=&quot;pay-btn&quot; href=&quot;${PAYSTACK_LINK}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pay &amp;#8358;200 to continue&lt;/a&gt;
      &lt;div class=&quot;unlock-row&quot;&gt;
        &lt;input type=&quot;text&quot; id=&quot;unlock-input-${context}&quot; placeholder=&quot;Enter unlock code&quot;&gt;
        &lt;button id=&quot;unlock-btn-${context}&quot;&gt;Unlock&lt;/button&gt;
      &lt;/div&gt;
      &lt;p class=&quot;unlock-msg&quot; id=&quot;unlock-msg-${context}&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;`;
}
function attachUnlockHandlers() {
  [&#39;notes&#39;,&#39;cards&#39;,&#39;quiz&#39;,&#39;past&#39;,&#39;chimene&#39;].forEach(context =&gt; {
    const btn = document.getElementById(`unlock-btn-${context}`);
    if (!btn) return;
    btn.addEventListener(&#39;click&#39;, () =&gt; tryUnlock(context));
    document.getElementById(`unlock-input-${context}`).addEventListener(&#39;keydown&#39;, e =&gt; { if (e.key === &#39;Enter&#39;) tryUnlock(context); });
  });
}
function tryUnlock(context) {
  const input = document.getElementById(`unlock-input-${context}`);
  const msg = document.getElementById(`unlock-msg-${context}`);
  const val = (input.value || &#39;&#39;).trim();
  if (val.toUpperCase() === UNLOCK_CODE.toUpperCase()) {
    unlocked = true;
    try { localStorage.setItem(&#39;examprep_unlocked&#39;, &#39;true&#39;); } catch(e) {}
    msg.textContent = &#39;Unlocked \u2014 enjoy full access.&#39;;
    msg.className = &#39;unlock-msg ok&#39;;
    setTimeout(() =&gt; { renderChapterRail(); renderAll(); }, 400);
  } else {
    msg.textContent = &#39;That code did not match. Check and try again.&#39;;
    msg.className = &#39;unlock-msg err&#39;;
  }
}

// ---------- tabs ----------
document.querySelectorAll(&#39;.tab-btn&#39;).forEach(btn =&gt; {
  btn.addEventListener(&#39;click&#39;, () =&gt; {
    document.querySelectorAll(&#39;.tab-btn&#39;).forEach(b =&gt; b.classList.remove(&#39;active&#39;));
    document.querySelectorAll(&#39;.panel&#39;).forEach(p =&gt; p.classList.remove(&#39;active&#39;));
    btn.classList.add(&#39;active&#39;);
    document.getElementById(`panel-${btn.dataset.tab}`).classList.add(&#39;active&#39;);
  });
});

// ---------- chapter content toggle (Notes / Flashcards) ----------
document.querySelectorAll(&#39;.ctab-btn&#39;).forEach(btn =&gt; {
  btn.addEventListener(&#39;click&#39;, () =&gt; {
    document.querySelectorAll(&#39;.ctab-btn&#39;).forEach(b =&gt; b.classList.remove(&#39;active&#39;));
    document.querySelectorAll(&#39;.csubpanel&#39;).forEach(p =&gt; p.classList.remove(&#39;active&#39;));
    btn.classList.add(&#39;active&#39;);
    document.getElementById(`content-${btn.dataset.content}`).classList.add(&#39;active&#39;);
  });
});

// ---------- init ----------
function renderAll() {
  renderHeader();
  renderNotes();
  renderFlashcard();
  renderQuiz();
  renderPast();
  renderChimene();
}
renderChapterRail();
renderPracticeList();
renderAll();
